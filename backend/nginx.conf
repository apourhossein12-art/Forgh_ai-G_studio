server {
    listen 80;
    server_name api.forge.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.forge.example.com;

    ssl_certificate /etc/letsencrypt/live/api.forge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.forge.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Rate limiting zone definition (add to http block):
    # limit_req_zone $binary_remote_addr zone=forge_limit:10m rate=10r/s;

    client_max_body_size 10M;

    location / {
        # limit_req zone=forge_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
